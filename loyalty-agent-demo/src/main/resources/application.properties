tavily.api.key=${TAVILY_API_KEY:}

quarkus.langchain4j.anthropic.api-key=${ANTHROPIC_API_KEY}
# Claude 5 models reject `temperature`/`top_k`, and quarkus-langchain4j 1.12.x
# always sends top_k=40 — so stay on claude-sonnet-4-5 until the extension stops
# defaulting it (or enable thinking, which nulls top_k).
quarkus.langchain4j.anthropic.chat-model.model-name=claude-sonnet-4-5
quarkus.langchain4j.anthropic.chat-model.max-tokens=4096
quarkus.langchain4j.anthropic.timeout=120s
quarkus.langchain4j.anthropic.log-requests=false
quarkus.langchain4j.anthropic.log-responses=false

quarkus.http.port=8080
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*

quarkus.log.category."dev.langchain4j".level=DEBUG
quarkus.log.category."io.quarkiverse.langchain4j".level=DEBUG

quarkus.log.console.format=%d{HH:mm:ss.SSS} %-5p [%c{1.}] %s%e%n

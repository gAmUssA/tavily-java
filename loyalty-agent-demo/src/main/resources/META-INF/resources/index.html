<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Loyalty Agent — Tavily + LangChain4j + Claude</title>
<style>
  :root {
    --bg: #0c1116;
    --panel: #141c25;
    --panel-2: #1a242f;
    --border: #1f2a36;
    --text: #e6edf3;
    --muted: #7d8590;
    --accent: #6c8cff;
    --tool: #58a6ff;
    --tool-dim: #3a6da8;
    --answer: #e6edf3;
    --error: #f85149;
    --done: #3fb950;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    line-height: 1.5;
  }

  /* HEADER */
  header {
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  header .sub {
    color: var(--muted);
    font-size: 13px;
    flex: 1;
  }
  header .toggle {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 12px;
    cursor: pointer;
    transition: color 120ms, border-color 120ms;
  }
  header .toggle:hover { color: var(--text); border-color: var(--muted); }
  header .toggle.on { color: var(--tool); border-color: var(--tool); }

  /* MODE SEGMENTED CONTROL */
  .mode {
    display: inline-flex;
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    margin-right: 8px;
  }
  .mode button {
    background: transparent;
    color: var(--muted);
    border: 0;
    padding: 6px 12px;
    font-family: var(--mono);
    font-size: 12px;
    cursor: pointer;
    transition: background 100ms, color 100ms;
  }
  .mode button + button { border-left: 1px solid var(--border); }
  .mode button:hover { color: var(--text); }
  .mode button.on    { background: var(--accent); color: #000; font-weight: 700; }
  .mode button.on.raw { background: var(--error); color: #fff; }

  /* MAIN */
  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 28px 24px 80px;
  }

  /* QUESTIONS */
  .canned {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 16px;
  }
  .canned button {
    text-align: left;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    padding: 12px 14px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    transition: background 120ms;
  }
  .canned button:hover { background: var(--panel-2); }
  .canned button:disabled { opacity: 0.5; cursor: wait; }
  .canned button .label {
    color: var(--accent);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    margin-right: 8px;
  }
  form {
    display: flex;
    gap: 8px;
    margin-bottom: 28px;
  }
  input[type=text] {
    flex: 1;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 12px 14px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 14px;
  }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button.go {
    background: var(--accent);
    color: #000;
    border: 0;
    padding: 12px 20px;
    border-radius: 4px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }
  button.go:disabled { opacity: 0.5; cursor: wait; }

  /* TICKER */
  #ticker {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 12px 14px;
    margin-bottom: 12px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 13px;
    min-height: 44px;
  }
  #ticker.active { color: var(--text); }
  #ticker.done    { color: var(--done); }
  #ticker.error   { color: var(--error); }
  #ticker .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
  }
  #ticker.active .dot { background: var(--accent); animation: pulse 1s ease-in-out infinite; }
  #ticker.done    .dot { background: var(--done); }
  #ticker.error   .dot { background: var(--error); }
  @keyframes pulse {
    0%, 100% { opacity: 0.4; transform: scale(1); }
    50%      { opacity: 1;   transform: scale(1.3); }
  }

  /* ANSWER */
  #answer {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 18px 22px;
    min-height: 140px;
    color: var(--answer);
    font-size: 15px;
    line-height: 1.6;
  }
  #answer.empty { color: var(--muted); font-style: italic; padding: 24px 22px; min-height: 80px; }
  #answer h1, #answer h2, #answer h3 { color: var(--accent); margin: 18px 0 8px; }
  #answer h1 { font-size: 22px; }
  #answer h2 { font-size: 18px; }
  #answer h3 { font-size: 16px; }
  #answer p { margin: 0 0 10px; }
  #answer ul, #answer ol { margin: 4px 0 14px 0; padding-left: 22px; }
  #answer li { margin: 3px 0; }
  #answer strong { color: var(--accent); }
  #answer code {
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 1px 6px;
    border-radius: 3px;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--tool);
  }
  #answer a { color: var(--tool); }
  #answer table {
    border-collapse: collapse;
    margin: 12px 0;
    width: 100%;
    font-size: 13px;
  }
  #answer th, #answer td {
    border: 1px solid var(--border);
    padding: 8px 12px;
    text-align: left;
    vertical-align: top;
  }
  #answer th {
    background: var(--panel-2);
    color: var(--accent);
    font-weight: 600;
  }
  #answer tr:nth-child(even) td { background: rgba(255,255,255,0.02); }

  /* TRACE (collapsible) */
  #trace-wrap {
    margin-top: 20px;
    overflow: hidden;
    max-height: 0;
    opacity: 0;
    transition: max-height 200ms ease, opacity 200ms ease;
  }
  #trace-wrap.open { max-height: 600px; opacity: 1; }
  #trace {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 14px 18px;
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1.65;
    max-height: 380px;
    overflow-y: auto;
  }
  #trace .head {
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    margin-bottom: 8px;
  }
  #trace .ev { margin: 0 0 3px; white-space: pre-wrap; word-break: break-all; }
  #trace .ev.tool-out { color: var(--tool); }
  #trace .ev.tool-in  { color: var(--tool-dim); }
  #trace .ev.query    { color: var(--accent); font-weight: 700; }
  #trace .ev.done     { color: var(--done); font-style: italic; }
  #trace .ev.error    { color: var(--error); }

  .placeholder { color: var(--muted); font-style: italic; }
</style>
</head>
<body>
<header>
  <h1>Loyalty Agent</h1>
  <span class="sub">Quarkus · LangChain4j · Tavily · Claude Sonnet 4.5</span>
  <span class="mode" role="tablist">
    <button id="mode-agent" class="on"   onclick="setMode('agent')">Agent</button>
    <button id="mode-raw"                onclick="setMode('raw')">Raw model</button>
  </span>
  <button id="toggle-trace" class="toggle" onclick="toggleTrace()">▶ Show trace</button>
</header>
<main>
  <div class="canned">
    <button id="btn-q1" onclick="run(this.dataset.q)" data-q="What's the current MileagePlus earning rate on United Polaris business?">
      <span class="label">Q1</span>What's the current MileagePlus earning rate on United Polaris business?
    </button>
    <button id="btn-q2" onclick="run(this.dataset.q)" data-q="I have 120,000 MileagePlus miles. Should I transfer to Avianca LifeMiles or fly United directly to Tokyo in March?">
      <span class="label">Q2</span>I have 120,000 MileagePlus miles. Should I transfer to Avianca LifeMiles or fly United directly to Tokyo in March?
    </button>
    <button id="btn-q3" onclick="run(this.dataset.q)" data-q="Find a recent United MileagePlus devaluation post on One Mile at a Time and show me the diff between the new and prior award chart as a markdown table.">
      <span class="label">Q3</span>Find a recent OMAAT devaluation post and show the diff as a markdown table.
    </button>
  </div>

  <form onsubmit="event.preventDefault(); run(document.getElementById('q').value);">
    <input type="text" id="q" placeholder="Or ask your own loyalty question…" autocomplete="off"/>
    <button class="go" id="go">Ask</button>
  </form>

  <div id="ticker"><span class="dot"></span><span id="ticker-text">Ask a question.</span></div>

  <div id="answer" class="empty">Answer streams here once a question runs.</div>

  <div id="trace-wrap">
    <div id="trace"><div class="head">AGENT TRACE</div></div>
  </div>
</main>

<script>
  /* ---------- mode ---------- */
  let mode = 'agent';
  function setMode(m) {
    mode = m;
    document.getElementById('mode-agent').classList.toggle('on',  m === 'agent');
    document.getElementById('mode-raw').classList.toggle('on',    m === 'raw');
    document.getElementById('mode-raw').classList.toggle('raw',   m === 'raw');
    // re-prime placeholder to match current mode
    if (document.getElementById('answer').classList.contains('empty')
        || /Ask a question|model gives/.test(document.getElementById('ticker-text').textContent)) {
      setTicker(m === 'raw'
        ? 'Raw model — no tools, no live web. Try a fact the model may have wrong.'
        : 'Ask a question.', null);
    }
  }

  /* ---------- toggle ---------- */
  let traceOpen = false;
  function toggleTrace() {
    traceOpen = !traceOpen;
    const wrap = document.getElementById('trace-wrap');
    const btn  = document.getElementById('toggle-trace');
    wrap.classList.toggle('open', traceOpen);
    btn.classList.toggle('on',    traceOpen);
    btn.textContent = traceOpen ? '▼ Hide trace' : '▶ Show trace';
  }

  /* ---------- run ---------- */
  function run(q) {
    if (!q) return;
    const goBtn   = document.getElementById('go');
    const allBtns = document.querySelectorAll('.canned button, button.go');
    allBtns.forEach(b => b.disabled = true);

    document.getElementById('q').value = q;
    resetState();
    setTicker(mode === 'raw'
      ? 'Raw model thinking… (no tools, no web)'
      : 'Thinking…', 'active');

    const url = '/agent/stream?q=' + encodeURIComponent(q) + '&mode=' + encodeURIComponent(mode);
    let answerBuf = '';

    fetch(url).then(async (resp) => {
      if (!resp.ok) {
        setTicker('HTTP ' + resp.status, 'error');
        addTrace('error', '[error] HTTP ' + resp.status);
        allBtns.forEach(b => b.disabled = false);
        return;
      }
      const reader  = resp.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        let nl;
        while ((nl = buf.indexOf('\n')) >= 0) {
          const line = buf.slice(0, nl).trim();
          buf = buf.slice(nl + 1);
          if (line) answerBuf = handleLine(line, answerBuf);
        }
      }
      if (buf.trim()) answerBuf = handleLine(buf.trim(), answerBuf);
      // final render in case the stream ended without a [done]
      renderAnswer(answerBuf);
      allBtns.forEach(b => b.disabled = false);
    }).catch((e) => {
      setTicker('Network error: ' + e, 'error');
      addTrace('error', '[error] ' + e);
      allBtns.forEach(b => b.disabled = false);
    });
  }

  function resetState() {
    document.getElementById('answer').innerHTML = '';
    document.getElementById('answer').classList.remove('empty');
    const trace = document.getElementById('trace');
    trace.innerHTML = '<div class="head">AGENT TRACE</div>';
  }

  /* ---------- event mapping ---------- */
  function handleLine(line, answerBuf) {
    // line is "data:[query] ..." or "data:[tool] → ..." etc.
    const m = line.match(/^data:\[(query|mode|tool|answer|done|error)\]\s?([\s\S]*)$/);
    if (!m) return answerBuf;
    const [, kind, body] = m;

    if (kind === 'query') {
      setTicker(mode === 'raw'
        ? 'Raw model thinking… (no tools, no web)'
        : 'Thinking…', 'active');
      addTrace('query', '▸ ' + body);
    } else if (kind === 'mode') {
      addTrace('tool-out', '⚠ ' + body);
    } else if (kind === 'tool') {
      // body starts with "→ " (out) or "← " (in)
      if (body.startsWith('→')) {
        setTicker(tickerFromToolOut(body), 'active');
        addTrace('tool-out', body);
      } else {
        setTicker(tickerFromToolIn(body), 'active');
        addTrace('tool-in', body);
      }
    } else if (kind === 'answer') {
      answerBuf += body + '\n';
      renderAnswer(answerBuf);
      setTicker('Composing answer…', 'active');
    } else if (kind === 'done') {
      const ms = parseInt(body, 10);
      const s  = isNaN(ms) ? body : (ms / 1000).toFixed(1) + 's';
      setTicker('✓ Answered in ' + s, 'done');
      addTrace('done', '─ done ' + body);
    } else if (kind === 'error') {
      setTicker('✗ ' + body, 'error');
      addTrace('error', '✗ ' + body);
    }
    return answerBuf;
  }

  function tickerFromToolOut(body) {
    // "→ tavily.search query=\"...\""  or  "→ tavily.extract https://..."
    if (body.includes('tavily.search')) {
      const m = body.match(/query="([^"]*)"/);
      const q = m ? m[1] : '';
      return 'Searching the web' + (q ? ': ' + truncate(q, 60) : '…');
    }
    if (body.includes('tavily.extract')) {
      const m = body.match(/extract\s+(\S+)/);
      const host = m ? hostOf(m[1]) : '';
      return 'Reading' + (host ? ': ' + host : ' page…');
    }
    return body;
  }
  function tickerFromToolIn(body) {
    // "← 5 results in 1014ms", "← success 33155 chars in 13277ms", "← failed: … in 900ms"
    if (body.startsWith('← failed:')) {
      return 'Page was gated or dead, trying another…';
    }
    if (body.includes('results in')) {
      const m = body.match(/← (\d+) results/);
      return 'Found ' + (m ? m[1] : '?') + ' results';
    }
    if (body.includes('chars in')) {
      const m = body.match(/(\d+) chars/);
      const chars = m ? parseInt(m[1], 10) : 0;
      if (chars === 0) return 'Page was empty (gated), trying another…';
      return 'Read ' + (chars > 1000 ? (chars / 1000).toFixed(1) + 'k' : chars) + ' chars';
    }
    return body;
  }

  function hostOf(url) {
    try { return new URL(url).hostname.replace(/^www\./, ''); }
    catch { return url.length > 40 ? url.slice(0, 40) + '…' : url; }
  }
  function truncate(s, n) {
    return s.length > n ? s.slice(0, n) + '…' : s;
  }

  /* ---------- ticker / trace / answer rendering ---------- */
  function setTicker(text, cls) {
    document.getElementById('ticker-text').textContent = text;
    const t = document.getElementById('ticker');
    t.classList.remove('active', 'done', 'error');
    if (cls) t.classList.add(cls);
  }

  function addTrace(cls, text) {
    const trace = document.getElementById('trace');
    const div = document.createElement('div');
    div.className = 'ev ' + cls;
    div.textContent = text;
    trace.appendChild(div);
    trace.scrollTop = trace.scrollHeight;
  }

  /* ---------- minimal markdown renderer (tables, lists, bold, code, links) ---------- */
  function renderAnswer(md) {
    document.getElementById('answer').innerHTML = mdToHtml(md);
  }
  function mdToHtml(src) {
    const lines = src.split('\n');
    const out = [];
    let i = 0;
    while (i < lines.length) {
      const line = lines[i];

      // table: header | separator | rows
      if (i + 1 < lines.length && /^\s*\|.+\|\s*$/.test(line)
          && /^\s*\|[\s\-:|]+\|\s*$/.test(lines[i + 1])) {
        const header = splitRow(line);
        i += 2;
        const rows = [];
        while (i < lines.length && /^\s*\|.+\|\s*$/.test(lines[i])) {
          rows.push(splitRow(lines[i])); i++;
        }
        out.push('<table><thead><tr>'
          + header.map(c => '<th>' + inline(c) + '</th>').join('')
          + '</tr></thead><tbody>'
          + rows.map(r => '<tr>' + r.map(c => '<td>' + inline(c) + '</td>').join('') + '</tr>').join('')
          + '</tbody></table>');
        continue;
      }

      // headers
      let mh;
      if ((mh = /^(#{1,3})\s+(.*)$/.exec(line))) {
        out.push('<h' + mh[1].length + '>' + inline(mh[2]) + '</h' + mh[1].length + '>');
        i++; continue;
      }

      // bullet list
      if (/^\s*[-*]\s+/.test(line)) {
        const items = [];
        while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
          items.push('<li>' + inline(lines[i].replace(/^\s*[-*]\s+/, '')) + '</li>');
          i++;
        }
        out.push('<ul>' + items.join('') + '</ul>'); continue;
      }
      // ordered list
      if (/^\s*\d+\.\s+/.test(line)) {
        const items = [];
        while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
          items.push('<li>' + inline(lines[i].replace(/^\s*\d+\.\s+/, '')) + '</li>');
          i++;
        }
        out.push('<ol>' + items.join('') + '</ol>'); continue;
      }

      // horizontal rule
      if (/^---+$/.test(line.trim())) { out.push('<hr/>'); i++; continue; }

      // blank line
      if (line.trim() === '') { i++; continue; }

      // paragraph (collapse adjacent non-blank, non-list, non-table lines)
      const para = [line];
      i++;
      while (i < lines.length
             && lines[i].trim() !== ''
             && !/^\s*[-*]\s+/.test(lines[i])
             && !/^\s*\d+\.\s+/.test(lines[i])
             && !/^\s*\|.+\|\s*$/.test(lines[i])
             && !/^#{1,3}\s+/.test(lines[i])) {
        para.push(lines[i]); i++;
      }
      out.push('<p>' + inline(para.join(' ')) + '</p>');
    }
    return out.join('');
  }

  function splitRow(line) {
    return line.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
  }

  function inline(s) {
    // escape angle brackets, then apply bold/italic/code/link
    let h = s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    h = h.replace(/`([^`]+)`/g, '<code>$1</code>');
    h = h.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    h = h.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    h = h.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    return h;
  }
</script>
</body>
</html>
